[package]
name = "tunnel-yard"
version = "3.0.2"
edition = "2021"
rust-version = "1.90"
description = "Gerenciador gráfico para conexões OpenFortiVPN"
license = "MIT"
repository = "https://github.com/LucasCavalheri/tunnel-yard"
authors = ["LucasCavalheri"]
default-run = "tunnel-yard"

[lib]
name = "tunnel_yard"
path = "src/lib.rs"

[[bin]]
name = "tunnel-yard"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }

gpui-kit = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
# GPUI uses Fontconfig to discover system fonts. Loading the runtime library keeps
# local builds independent from distro-specific Fontconfig development packages.
zed-font-kit = { version = "0.14.1-zed", features = ["source-fontconfig-dlopen"] }

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
