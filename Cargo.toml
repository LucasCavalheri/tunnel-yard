[package]
name = "my-vpns"
version = "2.5.0"
edition = "2021"
rust-version = "1.90"
description = "Gerenciador gráfico para conexões OpenFortiVPN"
license = "MIT"
repository = "https://github.com/LucasCavalheri/my-vpns"
authors = ["LucasCavalheri"]
default-run = "my-vpns"

[lib]
name = "my_vpns"
path = "src/lib.rs"

[[bin]]
name = "my-vpns"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
urlencoding = "2"
x509-parser = "0.17"

gpui-kit = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = "0.15"
tray-icon = "0.21"

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
sha2 = "0.10"
