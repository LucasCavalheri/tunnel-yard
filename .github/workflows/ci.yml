name: Platform checks
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - run: cargo test
      - run: cargo build
      - name: Smoke the shipped binary
        shell: bash
        run: ./target/debug/my-vpns --smoke
      - name: Check macOS helper syntax
        if: runner.os == 'macOS'
        run: bash -n packaging/macos-vpn.sh
