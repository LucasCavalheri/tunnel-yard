name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: my-vpns-linux-x64
          - os: windows-latest
            artifact: my-vpns-windows-x64
          - os: macos-latest
            artifact: my-vpns-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-release
          if [ -f target/release/my-vpns.exe ]; then
            cp target/release/my-vpns.exe dist-release/${{ matrix.artifact }}.exe
          else
            cp target/release/my-vpns dist-release/${{ matrix.artifact }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: dist-release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-release
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          else
            FLAGS+=(--prerelease=false --latest)
          fi
          VERSION="${TAG#v}"
          notes_from_changelog() {
            awk -v ver="$1" '
              BEGIN { p = 0 }
              $0 ~ "^## " ver "($| )" || $0 ~ "^## v" ver "($| )" { p = 1; next }
              p && /^## / { exit }
              p { print }
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//'
          }
          {
            echo "## My VPNs ${VERSION}"
            echo
            SECTION=""
            if [ -f CHANGELOG.md ]; then
              SECTION="$(notes_from_changelog "$VERSION" | sed -e '/./,$!d')"
            fi
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              cat <<'EOF'
          Native Rust desktop host. Linux/macOS use openfortivpn; Windows uses OpenConnect 9.21 + Wintun.
          Privileged helpers remain under `packaging/`.
          EOF
            fi
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" dist-release/* \
              --title "My VPNs ${TAG}" \
              --notes-file release-notes.md "${FLAGS[@]}"
          fi
