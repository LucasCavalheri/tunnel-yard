name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: tunnel-yard-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: tunnel-yard-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - run: cargo test --target "${{ matrix.target }}"
      - run: cargo build --release --target "${{ matrix.target }}"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-release
          binary="target/${{ matrix.target }}/release/tunnel-yard"
          cp "$binary" "dist-release/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v6
        with:
          name: build-${{ matrix.artifact }}
          if-no-files-found: error
          path: dist-release/*

  package-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_arch: amd64
            artifact: tunnel-yard-linux-x64
          - os: ubuntu-24.04-arm
            package_arch: arm64
            artifact: tunnel-yard-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: build-${{ matrix.artifact }}
          path: build-release
      - name: Create executable Linux archive
        run: |
          set -euo pipefail
          mkdir -p dist-release
          chmod 0755 "build-release/${{ matrix.artifact }}"
          tar -C build-release -czf "dist-release/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm zstd
      - name: Build Debian and RPM packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          chmod +x packaging/build-linux-packages.sh
          packaging/build-linux-packages.sh \
            "build-release/${{ matrix.artifact }}" \
            "$version" \
            "${{ matrix.package_arch }}" \
            dist-release
      - uses: actions/upload-artifact@v6
        with:
          name: packages-linux-${{ matrix.package_arch }}
          if-no-files-found: error
          path: dist-release/*

  publish:
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist-release
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          else
            FLAGS+=(--prerelease=false --latest)
          fi
          VERSION="${TAG#v}"
          notes_from_changelog() {
            awk -v ver="$1" '
              BEGIN { p = 0 }
              $0 ~ "^## " ver "($| )" || $0 ~ "^## v" ver "($| )" { p = 1; next }
              p && /^## / { exit }
              p { print }
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//'
          }
          {
            echo "## TunnelYard ${VERSION}"
            echo
            SECTION=""
            if [ -f CHANGELOG.md ]; then
              SECTION="$(notes_from_changelog "$VERSION" | sed -e '/./,$!d')"
            fi
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              cat <<'EOF'
          Native Rust desktop host for Linux. FortiGate SSL VPN via openfortivpn and PolicyKit helpers under `packaging/`.
          EOF
            fi
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" dist-release/* \
              --title "TunnelYard ${TAG}" \
              --notes-file release-notes.md "${FLAGS[@]}"
          fi
