name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: my-vpns-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: my-vpns-linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: my-vpns-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: my-vpns-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: my-vpns-windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: my-vpns-windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev vulkan-validationlayers libvulkan1
      - run: cargo test --target "${{ matrix.target }}"
      - run: cargo build --release --target "${{ matrix.target }}"
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist-release
          binary="target/${{ matrix.target }}/release/my-vpns"
          if [ -f "${binary}.exe" ]; then
            cp "${binary}.exe" "dist-release/${{ matrix.artifact }}.exe"
          else
            cp "$binary" "dist-release/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          if-no-files-found: error
          path: dist-release/*

  package-linux:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_arch: amd64
            artifact: my-vpns-linux-x64
          - os: ubuntu-24.04-arm
            package_arch: arm64
            artifact: my-vpns-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.artifact }}
          path: build-release
      - name: Create executable Linux archive
        run: |
          set -euo pipefail
          mkdir -p dist-release
          chmod 0755 "build-release/${{ matrix.artifact }}"
          tar -C build-release -czf "dist-release/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Install package builders
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm
      - name: Build Debian and RPM packages
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          chmod +x packaging/build-linux-packages.sh
          packaging/build-linux-packages.sh \
            "build-release/${{ matrix.artifact }}" \
            "$version" \
            "${{ matrix.package_arch }}" \
            dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.package_arch }}
          if-no-files-found: error
          path: dist-release/*

  package-macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: build-my-vpns-macos-arm64
          path: slices/arm64
      - uses: actions/download-artifact@v4
        with:
          name: build-my-vpns-macos-x64
          path: slices/x64
      - name: Create universal macOS binary
        run: |
          set -euo pipefail
          mkdir -p dist-release
          lipo -create \
            slices/arm64/my-vpns-macos-arm64 \
            slices/x64/my-vpns-macos-x64 \
            -output dist-release/my-vpns-macos
          lipo -info dist-release/my-vpns-macos
          codesign --force --sign - dist-release/my-vpns-macos
          codesign --verify --strict --verbose=2 dist-release/my-vpns-macos
      - name: Build macOS application bundle
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="dist-release/My VPNs.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp dist-release/my-vpns-macos "$app/Contents/MacOS/my-vpns"
          chmod 0755 "$app/Contents/MacOS/my-vpns"
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" public/icon.png --out "icon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" public/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/MyVPNs.icns"
          rm -rf icon.iconset
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>My VPNs</string>
            <key>CFBundleExecutable</key>
            <string>my-vpns</string>
            <key>CFBundleIconFile</key>
            <string>MyVPNs</string>
            <key>CFBundleIdentifier</key>
            <string>dev.cavallheri.myvpns</string>
            <key>CFBundleName</key>
            <string>My VPNs</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dmg-root
          cp -R "$app" dmg-root/
          hdiutil create -volname "My VPNs" -srcfolder dmg-root -ov -format UDZO \
            dist-release/my-vpns-macos.dmg
          hdiutil imageinfo dist-release/my-vpns-macos.dmg | grep -E 'Format:|Total Bytes:'
      - uses: actions/upload-artifact@v4
        with:
          name: build-my-vpns-macos
          if-no-files-found: error
          path: |
            dist-release/my-vpns-macos
            dist-release/my-vpns-macos.dmg

  publish:
    needs: [build, package-linux, package-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist-release
      - name: Keep only the universal macOS artifact
        run: |
          rm -f dist-release/my-vpns-macos-arm64 dist-release/my-vpns-macos-x64
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then
            FLAGS+=(--prerelease --latest=false)
          else
            FLAGS+=(--prerelease=false --latest)
          fi
          VERSION="${TAG#v}"
          notes_from_changelog() {
            awk -v ver="$1" '
              BEGIN { p = 0 }
              $0 ~ "^## " ver "($| )" || $0 ~ "^## v" ver "($| )" { p = 1; next }
              p && /^## / { exit }
              p { print }
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//'
          }
          {
            echo "## My VPNs ${VERSION}"
            echo
            SECTION=""
            if [ -f CHANGELOG.md ]; then
              SECTION="$(notes_from_changelog "$VERSION" | sed -e '/./,$!d')"
            fi
            if [ -n "$SECTION" ]; then
              printf '%s\n' "$SECTION"
            else
              cat <<'EOF'
          Native Rust desktop host. Linux/macOS use openfortivpn; Windows x64 uses OpenConnect 9.21 + Wintun. Windows ARM64 includes the native GUI and requires a native ARM64 VPN client.
          Privileged helpers remain under `packaging/`.
          EOF
            fi
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
          else
            gh release create "$TAG" dist-release/* \
              --title "My VPNs ${TAG}" \
              --notes-file release-notes.md "${FLAGS[@]}"
          fi
